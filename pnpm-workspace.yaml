packages:
  - 'packages/*'

# esbuild's postinstall links its platform binary (needed by tsx/tsup/vitest).
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.177'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.177'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.177'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.177'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.177'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.177'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.177'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.177'
  - '@anthropic-ai/claude-agent-sdk@0.3.177'
  - xrpl-mpp-sdk@0.1.0-beta.1

# Dependency overrides (pnpm 11 reads them here, not from package.json).
overrides:
  # Force the patched ws across the tree (GHSA-96hv-2xvq-fx4p, DoS). xrpl already
  # uses 8.21.0; this bumps the copy viem/isows pulls in (8.20.1) to match.
  ws: '>=8.21.0'
  # Patch freshly-disclosed CVEs in transitive deps with safe minor/patch bumps.
  # hono/fast-uri/body-parser come via @modelcontextprotocol/sdk (not exercised on
  # our XRPL flows); postcss is dev-only via vite. (@hono/node-server needs a 1->2
  # major and vite itself needs a vitest 2->3 major — both deferred.)
  hono: '>=4.12.27'
  fast-uri: '>=3.1.4 <4'
  body-parser: '>=2.3.0'
  postcss: '>=8.5.18'
